[project]
name = "proquest-dl"
version = "0.1.0"
description = "Download magazines from ProQuest (e.g. The Economist, MIT Technology Review)"
authors = [{ name = "Stephanie W Franco", email = "talia1984@yahoo.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.25.0",
    "natsort>=8.4.0",
    "borb>=2.1.25,<3",
    "tqdm>=4.66.5",
    "jsonpickle>=3.3.0",
    "requests>=2.32.0",
    "pypdf>=7.1.0",
]

[project.scripts]
proquest-dl = "proquest_dl.proquest_dl:main"
economist-dl = "proquest_dl.economist_dl:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
